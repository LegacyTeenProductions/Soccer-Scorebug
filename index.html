
<!-- MATCH CLOCK DISPLAY -->
<div class="timer" id="clock">45:00</div>

<!-- CLOCK CONTROLS -->
<div class="controls">
    <h3>Match Clock Settings</h3>

    <label>Minutes</label>
    <input type="number" id="minutes" value="45" min="0">

    <label>Seconds</label>
    <input type="number" id="secondsInput" value="0" min="0" max="59">

    <br>

    <button onclick="setClock()">SET TIME</button>
    <button onclick="startClock()">START</button>
    <button onclick="pauseClock()">PAUSE</button>
    <button onclick="resetClock()">RESET</button>

    <br><br>

    <button onclick="setHalf(45)">1ST HALF</button>
    <button onclick="setHalf(90)">2ND HALF</button>
</div>

<script>
let remainingSeconds = 45 * 60;
let startingSeconds = 45 * 60;
let interval = null;

function updateClock() {
    let mins = Math.floor(remainingSeconds / 60);
    let secs = remainingSeconds % 60;

    document.getElementById("clock").textContent =
        String(mins).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0");

    if (remainingSeconds === 0) {
        pauseClock();
    }
}

function setClock() {
    pauseClock();

    let mins = Math.max(0, parseInt(
        document.getElementById("minutes").value
    ) || 0);

    let secs = parseInt(
        document.getElementById("secondsInput").value
    );

    if (isNaN(secs)) secs = 0;

    secs = Math.max(0, Math.min(59, secs));

    remainingSeconds = (mins * 60) + secs;
    startingSeconds = remainingSeconds;

    updateClock();
}

function startClock() {
    if (interval !== null || remainingSeconds <= 0) return;

    interval = setInterval(() => {
        remainingSeconds--;
        updateClock();

        if (remainingSeconds <= 0) {
            remainingSeconds = 0;
            updateClock();
            pauseClock();
        }
    }, 1000);
}

function pauseClock() {
    clearInterval(interval);
    interval = null;
}

function resetClock() {
    pauseClock();
    remainingSeconds = startingSeconds;
    updateClock();
}

function setHalf(minutes) {
    pauseClock();

    remainingSeconds = minutes * 60;
    startingSeconds = remainingSeconds;

    document.getElementById("minutes").value = minutes;
    document.getElementById("secondsInput").value = 0;

    updateClock();
}

updateClock();
</script>
