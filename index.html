
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Scorebug</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #153b20;
    background-image:
      linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.4)),
      repeating-linear-gradient(
        90deg,
        #245b29 0px,
        #245b29 100px,
        #28632d 100px,
        #28632d 200px
      );
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 15px;
    font-family: Arial, Helvetica, sans-serif;
}

.scorebug {
    display: flex;
    align-items: stretch;
    height: 76px;
    width: min(850px, 100%);
    color: white;
    font-weight: 900;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,.5));
}

.team {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex: 1;
    font-size: clamp(17px, 3vw, 30px);
    letter-spacing: 1px;
}

.home {
    background: #0646a5;
    border-left: 5px solid white;
}

.away {
    background: #c50018;
    border-right: 5px solid white;
}

.crest {
    width: 38px;
    height: 38px;
    object-fit: contain;
    display: block;
}

.score {
    background: #111820;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 170px;
    font-size: clamp(25px, 4vw, 42px);
    padding: 0 18px;
    transform: skewX(-8deg);
}

.score span {
    transform: skewX(8deg);
}

.timer {
    background: #080b10;
    min-width: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    padding: 0 12px;
}

.controls {
    margin-top: 40px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: min(850px, 100%);
    color: #111;
}

.controls h2 {
    margin-top: 0;
}

.controls input {
    width: 100%;
    padding: 10px;
    margin: 5px 0 12px;
}

button {
    border: 0;
    padding: 12px 18px;
    margin: 4px;
    border-radius: 6px;
    background: #0755b5;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .8;
}

@media(max-width: 500px) {
    .scorebug {
        height: 58px;
    }

    .team {
        gap: 5px;
    }

    .crest {
        width: 25px;
        height: 25px;
    }

    .score {
        min-width: 90px;
        padding: 0 8px;
    }

    .timer {
        min-width: 75px;
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div>
    <div class="scorebug">

        <div class="team home">
            <img class="crest" id="homeCrest"
                 src="https://placehold.co/100x100/0646a5/ffffff?text=H"
                 alt="Home logo">
            <span id="homeName">CHE</span>
        </div>

        <div class="score">
            <span>
                <span id="homeScore">1</span>
                -
                <span id="awayScore">0</span>
            </span>
        </div>

        <div class="team away">
            <span id="awayName">LIV</span>
            <img class="crest" id="awayCrest"
                 src="https://placehold.co/100x100/c50018/ffffff?text=A"
                 alt="Away logo">
        </div>

        <div class="timer" id="clock">45:00</div>

    </div>

    <div class="controls">
        <h2>Scorebug Controls</h2>

        <label>Home Team</label>
        <input id="homeInput" value="CHE">

        <label>Away Team</label>
        <input id="awayInput" value="LIV">

        <button onclick="updateTeams()">Update Teams</button>

        <h3>Team Logos</h3>

        <label>Home Team Logo</label>
        <input type="file" id="homeLogoInput" accept="image/*">

        <label>Away Team Logo</label>
        <input type="file" id="awayLogoInput" accept="image/*">

        <h3>Score Controls</h3>
        <button onclick="changeScore('home',1)">Home +1</button>
        <button onclick="changeScore('home',-1)">Home -1</button>
        <button onclick="changeScore('away',1)">Away +1</button>
        <button onclick="changeScore('away',-1)">Away -1</button>

        <h3>Match Clock</h3>

        <label>Minutes</label>
        <input type="number" id="minutes" value="45" min="0">

        <label>Seconds</label>
        <input type="number" id="secondsInput" value="0" min="0" max="59">

        <button onclick="setClock()">SET TIME</button>
        <button onclick="startClock()">START</button>
        <button onclick="pauseClock()">PAUSE</button>
        <button onclick="resetClock()">RESET</button>
    </div>
</div>

<script>
let homeScore = 1;
let awayScore = 0;

// COUNTDOWN CLOCK
let seconds = 2700;
let startingSeconds = 2700;
let interval = null;

// SCORE CONTROLS
function updateDisplay() {
    document.getElementById("homeScore").textContent = homeScore;
    document.getElementById("awayScore").textContent = awayScore;
}

function changeScore(team, amount) {
    if (team === "home") {
        homeScore = Math.max(0, homeScore + amount);
    } else {
        awayScore = Math.max(0, awayScore + amount);
    }
    updateDisplay();
}

// TEAM NAMES
function updateTeams() {
    document.getElementById("homeName").textContent =
        document.getElementById("homeInput").value.toUpperCase();

    document.getElementById("awayName").textContent =
        document.getElementById("awayInput").value.toUpperCase();
}

// TEAM LOGOS
function uploadLogo(inputId, imageId) {
    const input = document.getElementById(inputId);

    input.addEventListener("change", function() {
        const file = this.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("Please select an image file.");
            return;
        }

        const reader = new FileReader();

        reader.onload = function(event) {
            document.getElementById(imageId).src =
                event.target.result;
        };

        reader.readAsDataURL(file);
    });
}

uploadLogo("homeLogoInput", "homeCrest");
uploadLogo("awayLogoInput", "awayCrest");

// COUNTDOWN CLOCK
function updateClock() {
    let minutes = Math.floor(seconds / 60);
    let secs = seconds % 60;

    document.getElementById("clock").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0");
}

function setClock() {
    pauseClock();

    let mins = Math.max(0, parseInt(
        document.getElementById("minutes").value
    ) || 0);

    let secs = parseInt(
        document.getElementById("secondsInput").value
    );

    if (isNaN(secs)) secs = 0;

    secs = Math.max(0, Math.min(59, secs));

    seconds = (mins * 60) + secs;
    startingSeconds = seconds;

    updateClock();
}

function startClock() {
    if (interval !== null || seconds <= 0) return;

    interval = setInterval(() => {
        seconds--;
        updateClock();

        if (seconds <= 0) {
            seconds = 0;
            updateClock();
            pauseClock();
        }
    }, 1000);
}

function pauseClock() {
    clearInterval(interval);
    interval = null;
}

function resetClock() {
    pauseClock();
    seconds = startingSeconds;
    updateClock();
}

// INITIAL DISPLAY
updateDisplay();
updateClock();

</script>

</body>
</html>
